<script>
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function esc(texto) {
  return String(texto ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function formatearFecha(f) {
  if (!f) return 'Sin fecha';
  const partes = String(f).split('-');
  if (partes.length !== 3) return esc(f);
  const mes = MESES[parseInt(partes[1], 10) - 1];
  if (!mes) return esc(f);
  return parseInt(partes[2], 10) + ' ' + mes;
}

async function cargarTareas() {
  const cont = document.getElementById('lista-tareas');
  const res = await fetch('/api/tareas');
  if (res.status === 401) {
    window.location.href = '/login';
    return;
  }

  const tareas = await res.json();

  document.getElementById('contador').textContent =
    tareas.length === 1 ? '1 tarea' : tareas.length + ' tareas';

  if (tareas.length === 0) {
    cont.innerHTML = '<p style="color:var(--suave);">No tienes tareas todavía. Agrega la primera arriba.</p>';
    return;
  }

  cont.innerHTML = tareas.map(t => `
    <div class="tarea" data-id="${t.id}">
      <strong class="tarea-titulo">${esc(t.titulo)}</strong>
      <span class="tarea-materia${t.materia ? '' : ' vacia'}">${esc(t.materia || 'Sin materia')}</span>
      <span class="tarea-fecha">${formatearFecha(t.fecha)}</span>
      <button class="borrar" onclick="borrarTarea(${t.id})">✕</button>
    </div>
  `).join('');
}

async function borrarTarea(id) {
  await fetch('/api/tareas/' + id, { method: 'DELETE' });
  cargarTareas();
}

document.getElementById('form-tarea').addEventListener('submit', async (e) => {
  e.preventDefault();

  await fetch('/api/tareas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      titulo: document.getElementById('titulo').value,
      materia: document.getElementById('materia').value,
      fecha: document.getElementById('fecha').value
    })
  });

  document.getElementById('form-tarea').reset();
  cargarTareas();
});

document.getElementById('btn-salir').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/';
});

(async () => {
  const res = await fetch('/api/sesion');
  if (res.status === 401) {
    window.location.href = '/login';
    return;
  }

  const data = await res.json();
  document.getElementById('saludo').textContent = 'Hola, ' + data.nombre;
  cargarTareas();
})();
</script>
