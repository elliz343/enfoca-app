<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Enfoca</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="pagina-login">

  <header class="navbar">
    <a class="logo" href="/">Enfoca</a>
    <nav>
      <a class="btn btn-texto" href="/registro">Crear cuenta</a>
    </nav>
  </header>

  <main class="login-hero">
    <section class="login-presentacion">
      <div class="login-copy">
        <h1>Tus metas<br>merecen organización.</h1>

        <h2>
          <span>Tu tiempo merece</span>
          <span>enfoque.</span>
        </h2>

        <p>Organiza tus días, avanza a tu ritmo y convierte tus pendientes en logros.</p>
      </div>

      <img
        class="login-foto"
        src="/static/enfoca-estudiante-login-v3.png"
        alt="Estudiante organizando sus tareas"
      >

      <div class="login-iconos" aria-hidden="true">
        <svg class="linea-icono" viewBox="0 0 150 400" preserveAspectRatio="none">
          <path d="M38 64C52 84 92 80 100 106"/>
          <path d="M104 174C100 196 60 192 44 212"/>
          <path d="M42 278C48 300 96 292 108 314"/>
        </svg>

        <svg class="icono icono-calendario" viewBox="0 0 80 80">
          <rect x="10" y="16" width="58" height="54" rx="9"/>
          <path d="M26 8v14M52 8v14M10 32h58"/>
          <path d="M23 44h4M36 44h4M49 44h4M23 56h4M36 56h4"/>
          <path class="detalle-verde" d="m46 58 6 6 12-14"/>
        </svg>

        <svg class="icono icono-birrete" viewBox="0 0 80 80">
          <path d="m6 30 34-17 34 17-34 17L6 30Z"/>
          <path d="M22 39v16c10 9 26 9 36 0V39"/>
          <path d="M70 33v20m0 0-3 7m3-7 3 7"/>
          <path class="detalle-verde" d="M16 62c8 7 17 10 27 10"/>
        </svg>

        <svg class="icono icono-lista" viewBox="0 0 80 80">
          <rect x="14" y="14" width="48" height="58" rx="7"/>
          <path d="M28 9h22v11H28z"/>
          <path d="m24 36 4 4 7-9m8 5h12"/>
          <path d="m24 51 4 4 7-9m8 5h12"/>
          <path d="m24 66 4 4 7-9m8 5h12"/>
        </svg>

        <svg class="icono icono-portapapeles" viewBox="0 0 80 80">
          <rect x="14" y="18" width="48" height="54" rx="7"/>
          <path d="M28 12h20v12H28z"/>
          <path d="M24 54h26"/>
          <path class="detalle-verde" d="m26 42 7 7 15-17"/>
        </svg>
      </div>
    </section>

    <section class="panel-form">
      <h2>Bienvenido de nuevo</h2>
      <p class="sub">Inicia sesión para ver tus tareas.</p>
      <div id="mensaje" class="mensaje"></div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button class="btn btn-primario" type="submit">Entrar</button>
      </form>

      <a class="enlace-sutil" href="/registro">¿No tienes cuenta? Regístrate</a>
    </section>
  </main>

  <footer>© 2026 Enfoca — Proyecto académico</footer>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();

      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'mensaje';
      mensaje.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'No se pudo iniciar sesión');
        }

        window.location.href = '/dashboard';
      } catch (err) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = err.message;
      }
    });
  </script>
</body>
</html>
