<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión | Enfoca</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
  <a class="logo" href="/">Enfoca</a>
  <nav><a class="btn btn-texto" href="/registro">Crear cuenta</a></nav>
</header>

<div class="panel-form">
  <h2>Bienvenido de nuevo</h2>
  <p class="sub">Inicia sesión para ver tus tareas.</p>
  <div id="mensaje" class="mensaje"></div>
  <form id="form-login">
    <div class="campo">
      <label for="email">Correo</label>
      <input type="email" id="email" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
    </div>
    <button class="btn btn-primario" type="submit">Entrar</button>
  </form>
  <a class="enlace-sutil" href="/registro">¿No tienes cuenta? Regístrate</a>
</div>

<footer>© 2026 Enfoca — Proyecto académico</footer>

<script src="/static/js/app.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById('mensaje');
  mensaje.className = 'mensaje';
  mensaje.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión');
    window.location.href = '/dashboard';
  } catch (err) {
    mensaje.className = 'mensaje error';
    mensaje.textContent = err.message;
  }
});
</script>
</body>
</html>
