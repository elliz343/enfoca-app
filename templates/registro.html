<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta | Enfoca</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
  <a class="logo" href="/">Enfoca</a>
  <nav><a class="btn btn-texto" href="/login">Iniciar sesión</a></nav>
</header>

<div class="panel-form">
  <h2>Crea tu cuenta</h2>
  <p class="sub">Empieza a organizar tus tareas en un minuto.</p>
  <div id="mensaje" class="mensaje"></div>
  <form id="form-registro">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>
    </div>
    <div class="campo">
      <label for="email">Correo</label>
      <input type="email" id="email" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <button class="btn btn-primario" type="submit">Crear cuenta</button>
  </form>
  <a class="enlace-sutil" href="/login">¿Ya tienes cuenta? Inicia sesión</a>
</div>

<footer>© 2026 Enfoca — Proyecto académico</footer>

<script>
document.getElementById('form-registro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById('mensaje');
  mensaje.className = 'mensaje';
  mensaje.textContent = '';
  try {
    const res = await fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta');
    mensaje.className = 'mensaje exito';
    mensaje.textContent = 'Cuenta creada. Redirigiendo a inicio de sesión...';
    setTimeout(() => window.location.href = '/login', 1200);
  } catch (err) {
    mensaje.className = 'mensaje error';
    mensaje.textContent = err.message;
  }
});
</script>
</body>
</html>
